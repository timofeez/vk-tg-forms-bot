name: bot

on:
  schedule:
    # Каждый запуск работает ~55 минут; новые ждут в очереди, так что перерывы короткие.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Одновременно работает только одна копия: иначе Telegram отклонит getUpdates.
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          VK_PEER_ID: ${{ secrets.VK_PEER_ID }}
          TEACHER_IDS: ${{ secrets.TEACHER_IDS }}
          RUN_MINUTES: "55"
        run: python -u bot.py

      # Сохраняем состояние даже при сбое или отмене, иначе бот забудет подписчиков.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}

      # GitHub отключает расписание в репозитории без коммитов 60 дней.
      - name: Keep schedule alive
        if: always()
        run: |
          now=$(date +%s)
          last=$(cat .keepalive 2>/dev/null || echo 0)
          if [ $((now - last)) -gt 604800 ]; then
            echo "$now" > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
